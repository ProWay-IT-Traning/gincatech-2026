<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Separa as Cores · GincaTech 2026</title>
<style>
:root {
  --bg: #f4f1fb; --surface: #ffffff; --fg: #1d1336; --muted: #5f5878; --line: #e0daef;
  --accent: #6b2fbf; --accent-2: #1fb3dd; --good: #127a45; --bad: #b8232b; --radius: 14px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
header { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center; }
header img { width: 120px; height: auto; }
header .ev { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.12; }
h2 { margin: 0; font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #ece4fb; color: var(--accent); }
label.f { display: grid; gap: 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--fg); }
textarea { min-height: 70px; resize: vertical; }
.regra { font-size: 14px; background: #f1ebfd; border-radius: 8px; padding: 8px 10px; color: #3b1f6e; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team { position: relative; border: none; border-radius: 14px; min-height: 88px; font-size: 22px; font-weight: 800; cursor: pointer; background: var(--c); color: var(--t); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); }
.team:active { transform: translateY(2px); }
.team[disabled] { opacity: .35; cursor: default; }
.team .pos { position: absolute; top: 8px; right: 10px; background: rgba(255,255,255,.92); color: #1d1336; border-radius: 99px; min-width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px; font-weight: 800; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.big { width: 100%; padding: 16px; font-size: 18px; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: default; }
.line { display: grid; grid-template-columns: 22px minmax(0, 1fr) 130px; gap: 10px; align-items: center; padding: 6px 0; }
.sw { width: 22px; height: 22px; border-radius: 6px; background: var(--c); }
.nm { font-weight: 800; font-size: 18px; }
.score { display: grid; gap: 6px; }
.score-row { display: grid; grid-template-columns: 34px 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.score-row .p { font-weight: 800; color: var(--muted); }
.score-row .d { color: var(--muted); font-size: 14px; }
.pts { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 800; }
.duelo { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.duelo:last-child { border-bottom: none; }
.duelo .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.duelo .cat { font-size: 13px; color: var(--muted); font-weight: 600; grid-column: 2; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; grid-column: 2; }
.vs .x { color: var(--muted); font-weight: 700; }
.pick { border: 2px solid var(--c); background: #fff; color: var(--fg); border-radius: 10px; padding: 10px 8px; font-weight: 800; cursor: pointer; }
.pick.win { background: var(--c); color: var(--t); }
.pick.lose { opacity: .45; }
.stack-cards { display: grid; gap: 14px; }
.jogo { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.jogo:last-of-type { border-bottom: none; }
.jogo .cat { font-size: 13px; color: var(--muted); font-weight: 700; }
.placar-jogo { display: grid; grid-template-columns: minmax(0, 1fr) 58px auto 58px minmax(0, 1fr); gap: 6px; align-items: center; }
.placar-jogo input { text-align: center; font-size: 20px; font-weight: 800; padding: 8px 4px; }
.placar-jogo .x { color: var(--muted); font-weight: 700; }
.eqn { background: var(--c); color: var(--t); border-radius: 10px; padding: 10px 6px; font-weight: 800; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pen { display: grid; gap: 6px; background: #fff4e5; border-radius: 10px; padding: 8px; }
.tablewrap { overflow-x: auto; }
table.tab { border-collapse: collapse; width: 100%; font-size: 14px; }
table.tab th, table.tab td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.tab th { font-size: 12px; color: var(--muted); }
table.tab td.n { text-align: right; font-variant-numeric: tabular-nums; }
.sw.sm { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; }
.team[aria-pressed="true"] { outline: 4px solid #1d1336; outline-offset: 2px; }
h3 { margin: 0; font-size: 16px; }
.rod-cab { margin-top: 14px; padding: 6px 10px; background: #f1ebfd; color: var(--accent); border-radius: 8px; font-size: 14px; }
.line.rod { grid-template-columns: 22px minmax(0, 1fr) repeat(var(--n), 92px); }
.line .cab { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 420px) { .mini { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.mini .pick { padding: 9px 4px; font-size: 15px; }
.podio { display: grid; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.podio:last-child { border-bottom: none; }
.slot { display: grid; gap: 6px; }
.slot-cab { font-size: 14px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabb { border: 2px solid var(--accent); background: #fff; color: var(--accent); border-radius: 99px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
.tabb.on { background: var(--accent); color: #fff; }
.aval { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.aval:last-child { border-bottom: none; }
.aval-cab { display: flex; gap: 8px; align-items: center; }
.aval-cab .muted { margin-left: auto; font-weight: 700; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; align-items: center; font-size: 14px; }
.entrega { display: grid; gap: 6px; padding-bottom: 6px; }
.chipb { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 7px 10px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.chipb.on { background: #e9f8f0; border-color: #b6e3c9; color: var(--good); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; border: 2px solid var(--c); background: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 800; font-size: 18px; cursor: pointer; text-align: left; }
.toggle.on { background: var(--c); color: var(--t); }
.toggle .st { font-size: 14px; font-weight: 700; }
.done { background: #e9f8f0; color: var(--good); font-weight: 700; padding: 10px 12px; border-radius: 10px; }
.warn { background: #fff4e5; color: #8a4b00; font-weight: 600; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.confirm { background: #fff1f1; border: 1px solid #f0c2c2; border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d1336; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); z-index: 9; }
.toast.bad { background: var(--bad); }
[hidden] { display: none !important; }
</style>

function el(tag, props, ...kids) {

  for (const [k, v] of Object.entries(props || {})) {

const ESPECIAIS = { "€": 128, "‚": 130, "„": 132, "…": 133, "•": 149, "–": 150, "—": 151, "‘": 145, "’": 146, "“": 147, "”": 148, "™": 153 };
function winAnsi(s) {
  let o = "";
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    if (c >= 32 && c < 127) o += ch; else if (c >= 160 && c <= 255) o += ch;
    else if (ESPECIAIS[ch]) o += String.fromCharCode(ESPECIAIS[ch]); else if (c === 10 || c === 9) o += " "; else o += "?";

const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map(x => x.toFixed(3)).join(" "); };

    ret(x, y, w, h, cor) { cur().push(rgb(cor) + " rg " + x.toFixed(1) + " " + (H - y - h).toFixed(1) + " " + w.toFixed(1) + " " + h.toFixed(1) + " re f"); },
    linha(x1, y1, x2, y2, cor) { cur().push(rgb(cor || "#d6d0e6") + " RG 0.8 w " + x1 + " " + (H - y1) + " m " + x2 + " " + (H - y2) + " l S"); },
    jpeg(bin, pw, ph, x, y, w, h) { imagem = { bin, pw, ph }; cur().push("q " + w.toFixed(1) + " 0 0 " + h.toFixed(1) + " " + x.toFixed(1) + " " + (H - y - h).toFixed(1) + " cm /Im1 Do Q"); },
    montar(info) {
      const objs = [];
      const add = s => { objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>");
      add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      add("<< /Title (" + winAnsi(info.titulo) + ") /Author (" + winAnsi(info.autor) + ") /Subject (" + winAnsi(info.assunto) + ") /Keywords (" + info.dados + ") /Producer (GincaTech) >>");
      const img = imagem ? add("<< /Type /XObject /Subtype /Image /Width " + imagem.pw + " /Height " + imagem.ph + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + imagem.bin.length + " >>\nstream\n" + imagem.bin + "\nendstream") : 0;
      const kids = [];
      for (const ops of pages) {
        const conteudo = ops.join("\n");
        const c = add("<< /Length " + conteudo.length + " >>\nstream\n" + conteudo + "\nendstream");
        kids.push(add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>" + (img ? " /XObject << /Im1 " + img + " 0 R >>" : "") + " >> /Contents " + c + " 0 R >>"));

      const offs = [];

function quebrar(s, max) {

  for (const par of String(s).split(/\r?\n/)) {

    linhas.push(l);

}

async function entregar(blob, nome) {
  const arquivo = new File([blob], nome, { type: "application/pdf" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      await navigator.share({ files: [arquivo], title: nome, text: "Relatório da prova " + P.nome });
      toast("Relatório pronto para enviar.");
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") { toast("Envio cancelado. Toque em Gerar de novo quando quiser."); return; } }
  baixar(blob, nome);
}
function baixar(blob, nome) {
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: nome });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast("PDF salvo em Downloads. Envie pelo WhatsApp.");
}
